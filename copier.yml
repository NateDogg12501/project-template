_subdirectory: template
_min_copier_version: "9.0.0"

_envops:
  trim_blocks: true
  lstrip_blocks: true

# Which files exist is decided by the *path names* under template/ — a
# directory literally named `{{ 'terraform' if needs_hosting else '' }}`
# renders to the empty string when HOSTED is off, and Copier skips it and
# everything under it. Gating therefore lives next to the content it gates,
# and (unlike the `rm -rf` tasks this replaced) it applies to `copier update`
# too, not only to the first `copier copy`. See docs/decisions.md.
_tasks:
  - command: "git init"
    when: "{{ _copier_operation == 'copy' }}"
  # Installs before the first commit so the lock files are *in* it. Both npm
  # CI jobs run `npm ci`, which fails outright without a lock file, and a
  # scaffolded project should be able to run its own tests immediately rather
  # than after an undocumented setup step. Not a substitute for path-name
  # gating — these tasks build, they don't prune.
  - command: "npm install --prefix backend"
    when: "{{ _copier_operation == 'copy' and needs_api }}"
  - command: "npm install --prefix frontend"
    when: "{{ _copier_operation == 'copy' and needs_ui }}"
  # The deploy pipeline's stages are their own package: application code never
  # imports them, and they ship a devDependency (vitest) that nothing at deploy
  # time needs. The stages themselves run on the runner's Node with no install;
  # this lock file is for CI's `pipeline-stages` job, which runs their tests.
  - command: "npm install --prefix .github/actions"
    when: "{{ _copier_operation == 'copy' and needs_hosting }}"
  - command: "git add -A"
    when: "{{ _copier_operation == 'copy' }}"
  - command: >-
      git commit --quiet -m "Scaffold from project-template (preset: {{ flavor }})"
    when: "{{ _copier_operation == 'copy' }}"
  - command: >-
      gh repo create {{ (github_owner + '/') if github_owner else '' }}{{ project_slug }} --private --source=. --remote=origin --push
    when: "{{ _copier_operation == 'copy' }}"

project_name:
  type: str
  help: "Project name (human-readable)"
  placeholder: "Recipe Box"

project_slug:
  type: str
  help: "Lowercase, hyphenated slug — used for the Lambda function name, DynamoDB table prefix, package.json name"
  placeholder: "recipe-box"
  default: "{{ project_name | lower | replace(' ', '-') }}"

description:
  type: str
  help: "One sentence: what this project is (goes into README.md and CLAUDE.md)"
  placeholder: "A small app for saving and tagging recipes"

# A preset only moves the *defaults* of the capability questions below; it
# owns no files of its own. Every capability stays individually overridable
# after a preset is picked, so a preset can never be the reason a project
# can't have some combination. See STANDARDS.md's "Presets".
flavor:
  type: str
  help: "Preset — pre-selects the capability answers below. You can still override each one."
  choices:
    "core — API + UI, deployed to AWS": core
    "prototype — API + UI, local-only": prototype
  default: core

needs_api:
  type: bool
  help: "API capability: an Express backend in backend/, run by docker compose."
  default: true

needs_ui:
  type: bool
  help: "UI capability: static files in frontend/."
  default: true
  validator: "{% if not needs_api and not needs_ui %}A project needs at least one of API or UI — with both off this template generates docs and nothing else.{% endif %}"

# Depends on API: the HOSTED path deploys a Node handler behind a Lambda
# Function URL, so there has to be a server to deploy. `when` keeps the
# question from being asked when it cannot apply; the default repeats the
# condition so a skipped question still resolves to false rather than to the
# preset's value.
needs_hosting:
  type: bool
  help: "HOSTED capability: deployed to AWS Lambda (Always Free), as well as run locally."
  default: "{{ needs_api and flavor != 'prototype' }}"
  when: "{{ needs_api }}"

needs_datastore:
  type: bool
  help: "DATABASE capability: DynamoDB via the shared terraform-modules dynamodb-single-table module. Requires HOSTED."
  default: false
  when: "{{ needs_hosting }}"

# This project's own AWS region — the Lambda, and `variable "aws_region"`'s
# default in the main config. Deliberately NOT rendered into backend.tf's
# `region`: the state bucket lives wherever the account-level bootstrap put
# it (see STANDARDS.md's "Hosting"), which is fixed and shared across every
# project regardless of any one project's chosen region, so backend.tf hard-
# codes that region as its own literal instead of reusing this answer — a
# project that picked a non-default `aws_region` would otherwise get a
# backend block pointing at the wrong region for the shared bucket.
#
# Skipped when HOSTED is off, and a skipped question still resolves to its
# default — so nothing can render undefined. What a skipped question does not
# get is a line in `.copier-answers.yml`: a project that turns HOSTED on later
# must set this there (or pass `--data`) in the same edit, or `copier update`
# silently recomputes it as us-east-1.
aws_region:
  type: str
  help: "AWS region for the Lambda and other project-owned resources (not the shared state bucket, which lives in a fixed region)."
  default: "us-east-1"
  when: "{{ needs_hosting }}"

author_name:
  type: str
  help: "Your name, for README.md / LICENSE"
  default: "Nathan Schlechte"

github_owner:
  type: str
  help: >-
    Org/user to create the GitHub repo under. Leave blank to let `gh` default
    to whoever it's authenticated as — the right choice for a human running
    this interactively. Only needed when the token driving `gh repo create`
    is scoped to an org (e.g. a fine-grained PAT whose resource owner is an
    org): `gh repo create <bare-name>` always targets the token's *personal*
    namespace regardless of scope, which such a token has no permission for.
  default: ""
